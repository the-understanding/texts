site_name: 理解すること  〜初学者のための10の質問〜
docs_dir: markdown

theme:
  name: readthedocs
  language: ja
  features:
    - user_color_mode_toggle
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest

plugins:
  - search             # 検索機能を有効化
  - i18n:
      default_language: ja
      languages:
        ja:
          name: 日本語
          docs_dir: /ja
          build: true
          nav:
            - ホーム: index.md
            - まえがき: preface.md
            - 第1章 認識・情報:
                - 1.1 問1: 1-1.md
                - 1.2 観測・情報生成: 1-2.md
                - 1.3 知覚・認識: 1-3.md
                - 1.4 概念: 1-4.md
            - 第2章 分類・構造化:
                - 2.1 問2: 2-1.md
                - 2.2 比較: 2-2.md
                - 2.3 分類・整理: 2-3.md
                - 2.4 情報の構造化: 2-4.md
            - 第3章 論理・演算:
                - 3.1 問3: 3-1.md
                - 3.2 集合・論理: 3-2.md
                - 3.3 命題・論証: 3-3.md
